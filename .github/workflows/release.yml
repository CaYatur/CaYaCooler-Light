name: Release CaYaControl

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file win-x64 build
        working-directory: pc-app
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Zip publish output
        run: >
          Compress-Archive
          -Path "pc-app/bin/Release/net8.0-windows/win-x64/publish/*"
          -DestinationPath "CaYaControl-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: CaYaControl-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
